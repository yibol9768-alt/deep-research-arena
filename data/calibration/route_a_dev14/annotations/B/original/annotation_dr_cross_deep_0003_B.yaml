# === Batch 1: 无辅助提取（原文保存）===
initial_response: |-
  Q1: 产生的输出是对用户的建议；产生的决策是分析"买一个好的降噪头戴"或"买两个（无线耳塞+小音箱）"两种方案的优劣势，帮助用户决策。

  Q2: 必须覆盖两种方案的优缺点对比、结合$250预算的产品推荐、两种形态在不同使用场景（办公室vs露营）的分析，且要近期时效。

  Q3: 验证"小耳塞降噪物理上不如大耳罩"是否真实。

  Q4: $250预算是最硬约束，必须实质性影响比较和推荐。

  Q5: 不需要社区经验，但需要专业性的专家解读（降噪原理分析）。

  Q6: 不可省略内容：两种方案对比、产品推荐（结合$250）、验证降噪差异、权衡分析（trade-off）、时效性。

  Q7: 没有特别模糊的内容。

initial_requirements:
  - 对比分析两种方案优劣势，覆盖不同使用场景
  - 为两种方案推荐具体产品，严格在$250预算内
  - 验证小耳塞降噪是否不如大耳罩
  - 给出最终购买建议
  - 确保推荐产品的时效性

