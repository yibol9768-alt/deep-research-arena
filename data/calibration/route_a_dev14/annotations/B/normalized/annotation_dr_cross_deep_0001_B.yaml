# === Batch 1: 无辅助提取（原文保存）===
initial_response: |-
  Q1: 首先要进行一个思辨的内容，就是贵的东西真的更好吗？还是在为 logo 买单？要体现这个思辨性，最终推理的结果要回答是否真的有用，还是只是在为品牌的溢价买单。还需要输出一个不同价位的靠谱推荐，还有具体的理由。

  Q2: 报告中必须覆盖贵的东西溢价的原因或背后的技术或品牌影响力。每个价位都要覆盖产品。说法上先体现思辨，最后列出推荐的商品及靠谱理由。时间段要尽量是近期的，因为商品在不断更新迭代。

  Q3: 需要验证贵的东西是否真的更好，以及解释选择不同价位推荐的产品及背后的理由。

  Q4: 约束必须有不同价位以及背后的理由。

  Q5: 不需要社区或专家经验，但用户经常坐公交并在办公室工作，隔音很重要。可以看相似处境用户的经验，也反映出用户注重性价比。

  Q6: 不能省略的内容：分析是否贵得值、不同价位推荐、推荐理由、降噪能力评估、ANC/编解码验证。

  Q7: 模糊短语："expensive stuff"的价格定义、"a few solid picks"的数量、"different prices"的价位划分、"blocking out sound"是被动隔音还是主动降噪、"genuinely better"的评判标准。

initial_requirements:
  - 分析"贵的东西是否真的更好"，判断技术溢价还是品牌溢价
  - 提供不同价位的靠谱推荐
  - 解释每条推荐背后的理由
  - 验证主动降噪和蓝牙编解码器是否名副其实
  - 评估降噪/隔音能力，结合用户场景
  - 确保推荐产品的时效性（近期在售）

