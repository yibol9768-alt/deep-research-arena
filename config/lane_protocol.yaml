        human_en: "SMOLAGENTS_SEARCH_SNIPPET_CHARS=650: per-result snippet length the model sees; SMOLAGENTS_MIN_REPORT_CHARS=3500 is diagnostic only and cannot replace a short real report."
        detail: "SMOLAGENTS_SEARCH_SNIPPET_CHARS=650: per-result snippet length our ShimSearchTool wrapper passes. It bounds how much of each result the model sees. SMOLAGENTS_MIN_REPORT_CHARS=3500 is diagnostic only: keep_or_stub preserves every non-stub native output verbatim, so this threshold cannot replace a short real report. Both values are recorded by run_manifest and operator overrides are rejected for formal runs."
