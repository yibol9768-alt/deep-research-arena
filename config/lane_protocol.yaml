# Lane protocol: the declared, auditable contract for every benchmark lane.
#
# WHY THIS FILE EXISTS
#
# Until 2026-07-08 each lane's adapter quietly decided what its framework was
# told, how long it could run, and whether the harness would help it. The
# fairness audit found, among others:
#
#   - ldr's report had a "### Sources" block written by the harness. Deleting it
#     and rescoring dropped macro reach from 0.9519 to 0.0000 (qwen) and 0.9868
#     to 0.0000 (deepseek). The lane that ranked #1 on both boards had never
#     written a sandbox URL itself.
#   - smolagents was told "the report is invalid unless it contains at least 5
#     exact http://localhost URLs", and got a free retry whenever it missed that
#     bar. No other lane got a retry.
#   - gpt-researcher was handed a literal example citation which it copied
#     verbatim as its only sandbox URL.
#   - ldr rewrote any `en.wikipedia.org/wiki/X` the model emitted into a valid
#     Kiwix sandbox URL, converting off-sandbox drift into perfect grounding.
#   - Lane wall clocks ranged from 240s (qx-agents) to unlimited (camel-ai).
#
# None of this was written down anywhere. The rule now: a lane may only differ
# from the shared protocol in ways declared here, and `scripts/check_parity.py`
# fails the preflight when the code disagrees with this file.
#
# WHAT PARITY MEANS HERE
#
# Parity is on CAPABILITY, not on the literal prompt string. A native lane gets
# the sandbox as an in-process tool; a CLI lane has no search tool and must be
# told how to curl the shim. Those deliveries differ by necessity. What must be
# identical is the TASK: no lane may be told a citation count, a word count, a
# search count, or a citation format, because each of those is a scored axis.
#
# Budget policy (decided 2026-07-08): there is NO comparative wall clock. Cost
# is compared in tokens, which is what the cost-per-score axis reports. A single
# uniform no-progress watchdog kills a lane that has made no LLM call and no
# shim call for `stall_timeout_s`; that outcome is recorded as `stalled`
# (infrastructure), never as a framework failure, and is rerunnable.

version: lane-protocol-v1
date: 2026-07-08

shared:
  # Every lane receives exactly this and nothing more.
  intent_source: data/tasks/deep_research/cross_site_deep/<task_id>.json  # field: intent
  appended_to_intent: |
    Deliver your answer as a single self-contained markdown report. Return the
    report only, with no planning notes or tool transcripts.
  # Capability granted to every lane, in whatever form its runtime accepts.
  capabilities:
    search: shim POST /search        # one search affordance
    fetch: shim GET /fetch?url=...   # one page-read affordance, recorded
  # Anything not listed here is forbidden.
  forbidden_in_prompt:
    - citation counts        # "cite at least N URLs"
    - word or character counts
    - paragraph counts
    - search-call counts
    - search-breadth prescriptions  # "issue multiple queries"
    - fetch-all/every-result prescriptions
    - cross-source strategy prescriptions  # "cross-reference all three sites"
    - citation format prescriptions  # "use markdown links [label](url)"
    - example URLs
    - enumerations of the scorer's rubric
  forbidden_in_harness:
    - injecting URLs or source blocks into the saved report
    - rewriting URLs the model emitted (masking round-trips excepted)
    - retrying or repairing a report based on any scored quantity
    - gating capture on any scored quantity (reach, PoF, completeness)

budget:
  # This section is the SHARED budget policy (time and cost). PER-LANE budget
  # knobs (step cap, results-per-search, token/context window) are NOT uniform
  # and live in each lane's `deviations` as `kind: budget`; check_parity's
  # env_budget rule enforces that every such knob in code is declared there.
  wall_clock_s: null           # no comparative time limit
  stall_timeout_s: 900         # uniform no-progress watchdog (15 min)
  stall_status: stalled        # distinct from `timeout`; not a framework failure
  cost_axis: tokens            # llm_gateway usage log, attributed by run_id
  # Outer subprocess timeouts (OPENCODE_TIMEOUT, DEERFLOW_TASK_TIMEOUT_S,
  # FLOWSEARCHER_*_TIMEOUT, ...) are infrastructure caps governed by this uniform
  # policy, not scored budgets, so they are intentionally OUTSIDE the env_budget
  # rule's four suffixes (MAX_STEPS, SEARCH_MAX_RESULTS, TOKEN_LIMIT,
  # CONTEXT_LIMIT). The stall watchdog, not a per-lane clock, is the terminator.

backbone:
  # Cross-backbone comparison is only meaningful when nothing but the weights
  # changes. These must be identical across lanes AND across backbones.
  # NOT uniform, and saying so out loud beats a word that was never enforced.
  # llm_gateway injects {"thinking": {"type": "disabled"}} for deepseek-v4-*
  # only. GLM keeps thinking ON per the 2026-07-06
  # full-run decision. So a cross-backbone board compares a reasoning model
  # against a non-reasoning one, and swapping the backbone swaps more than the
  # weights. `preflight.check_backbone_sampling` asserts the code matches this
  # declaration; equalising it is a maintainer decision, not a code fix.
  thinking:
    uniform: false
    per_backbone:
      qwen3-8b: "on"
      glm-4.7-flash: "on"
      deepseek-v4: "off"
    note: >-
      Cross-backbone truth comparison is confounded while this is false.
      Single-backbone boards are unaffected.
  max_output_tokens: 8192
  # The word above said "identical" and nothing enforced it: the gateway capped
  # qwen at 8192, left deepseek uncapped, and RAISED glm to 131072, while
  # ds_proxy (the door eleven lanes use) enforced nothing. Both proxies now clamp
  # to this value via integrations/sampling_policy.apply_max_tokens, and a lane
  # that sends no max_tokens gets it explicitly instead of the upstream default.
  #
  # glm's exception is the thinking decision made visible: glm keeps thinking ON
  # (2026-07-06) and its thinking spends from the same max_tokens budget, so a
  # uniform 8192 would starve its visible answer. Cross-backbone comparison
  # against glm is confounded by this, exactly as the thinking note above says.
  max_output_tokens_exceptions:
    glm-4.7-flash: 131072
  temperature: 0.2
  # No lane set top_p except costorm (0.9), and no proxy forced it. 1.0 is the
  # no-truncation default: the sampler is then fully described by temperature.
  top_p: 1.0
  gateway: llm_gateway         # unified three-backbone endpoint on :8100

# fetch_observable / fetch_mode: whether a lane's PAGE READS pass through the
# recording shim, and by what mechanism. This is the transport-level provenance
# contract added 2026-07-08. The harness reads `fetch_observable` here and sends
# it on the shim /_mark bracket; `src/eval/fetch_log.py` withholds `pof` for any
# lane declared false, so a lane that reads pages off-shim is never scored 0 and
# never accused of citing pages it did not open. Filled honestly from the audit
# (internal/docs/FETCH_PATH_AUDIT_2026-07-08.md), NOT optimistically:
#
#   fetch_observable: true  -> every page read this lane can do goes through the
#                              shim (or the lane reads no pages at all), so the
#                              transport metrics are trustworthy for it.
#   fetch_observable: false -> the lane has a page-read channel that bypasses the
#                              shim; pof is withheld until that channel is
#                              converged AND a smoke run shows fetch rows > 0.
#
#   fetch_mode values:
#     shim_extract   -> POST {shim}/extract (recorded)
#     shim_fetch     -> GET {shim}/fetch?url= (recorded)
#     direct_requests-> requests.get to the site (bypasses shim)
#     direct_aiohttp -> aiohttp session.get to the site (bypasses shim)
#     direct_curl    -> shell `curl` to the site (bypasses shim)
#     none           -> no page-read step; consumes search snippets only
#     unknown        -> upstream not installed/read yet; must be verified on-box
#                       before any pof is recorded for it
lanes:
  # `deviations` must be empty for a lane to count as protocol-clean. A non-empty
  # list is a declared, justified exception that the board must disclose.
  #
  # kind: budget (added 2026-07-09, P4). A per-lane knob that bounds how much a
  # lane can retrieve, hold, or write: step cap, results-per-search, token or
  # context window. These are never in the prompt, so the prompt-parity RULES in
  # scripts/check_parity.py never saw them, yet they move reach and completeness
  # exactly as a prompt steer would. Any `os.environ.get("<LANE>_MAX_STEPS" |
  # "<LANE>_SEARCH_MAX_RESULTS" | "<LANE>_TOKEN_LIMIT" | "<LANE>_CONTEXT_LIMIT")`
  # in the adapter surface MUST be named in a {kind: budget} deviation for that
  # lane; check_parity's env_budget rule fails the preflight otherwise. The rule
  # forces the asymmetry to be written down; it does not equalise the VALUE,
  # because heterogeneous frameworks have no common step/token unit. The detail
  # states the exact env var, its value, and whether it is framework-required
  # (part of delivery) or harness-imposed (our own code).
  deerflow:        {delivery: subprocess,  fetch_observable: false, fetch_mode: direct_requests, deviations: [{kind: budget, detail: "DEERFLOW_TOKEN_LIMIT: DeerFlow context-compression threshold (scripts/runners/deerflow_runner.py:422). Env-overridable; default unset = None = DeerFlow's own model-name inference, the framework default. On the default board no harness cap is imposed, so this lane is on par; an operator override is the only way a per-lane token budget appears, and it is disclosed by this entry. Declared because a token/context window bounds how much a lane can read and write, and therefore moves completeness."}]}
  # storm and langchain-odr read no pages: their only affordance is shim /search,
  # so a pof of 0 is honest, not an accusation. Their real cited URLs land in
  # `snippet_only` (search returned them). fetch_observable stays true because
  # there is no off-shim read to miss; withholding here would drop the honest
  # snippet_only classification.
  storm:           {delivery: in_process,  fetch_observable: true,  fetch_mode: none, deviations: [{kind: capability_delivery, detail: "STORM's post-retrieval SentenceTransformer index is replaced with a deterministic lexical scorer because the formal offline worker has no embedding-model download channel. Research budgets remain native: max_conv_turn=3, max_perspective=3, search_top_k=3, retrieve_top_k=3, and max_thread_num=10. The lexical ranking substitution can change which already-collected snippets reach article generation and must be disclosed on comparative boards until a pinned read-only native embedding cache is mounted."}]}
  qx-agents:       {delivery: subprocess,  fetch_observable: false, fetch_mode: direct_aiohttp, deviations: [{kind: capability_delivery, detail: "The native qx DeepResearcher pipeline uses its SearchXNG interface through a local shim translator and the requested local OpenAI-compatible backbone. A parser shim removes only explicit <think> wrappers before qx's normal schema validation; it does not fabricate fallback objects."}, {kind: budget, detail: "Framework-native budgets: max_iterations=5, max_time_minutes=10, openai-agents max_turns=10, and SearchXNG pageLength default 10. The former harness-specific 1 iteration / 4 minute / 12 turn mix was removed."}]}
  # camel-ai's only page-read channel is the shim /extract tool (used when the
  # model calls tavily_extract); it has no direct-fetch bypass, so metrics are
  # trustworthy even though a given run may not fetch at all.
  camel-ai:        {delivery: in_process,  fetch_observable: true,  fetch_mode: shim_extract, deviations: []}
  # smolagents' VisitWebpageTool uses requests.get direct to the site. The
  # in-process gate can rewrite sandbox GETs to {shim}/fetch, but it is only
  # installed under --strict-sandbox today; on the default board the read is
  # off-shim. Keep false until the gate is installed on this path AND a smoke run
  # shows fetch rows > 0, per the audit's ordering rule.
  smolagents:      {delivery: in_process,  fetch_observable: false, fetch_mode: direct_requests, deviations: [{kind: budget, detail: "SMOLAGENTS_MAX_STEPS=20: smolagents ToolCallingAgent agentic-loop cap (scripts/run_deep_task.py). This is the framework constructor's native default, restored after the adapter-specific grant of 24 steps was removed. The env name remains declared because any operator override changes retrieval capacity and is rejected for formal runs."}, {kind: budget, detail: "SMOLAGENTS_SEARCH_MAX_RESULTS=6: results-per-search our ShimSearchTool wrapper passes to shim /search (scripts/run_deep_task.py). Harness-imposed by our tool code. 6 is lower than the 10 several CLI and native lanes request; results-per-search is not uniform across heterogeneous frameworks."}, {kind: budget, detail: "SMOLAGENTS_SEARCH_SNIPPET_CHARS=650: per-result snippet length our ShimSearchTool wrapper passes. It bounds how much of each result the model sees. SMOLAGENTS_MIN_REPORT_CHARS=3500 is diagnostic only: keep_or_stub preserves every non-stub native output verbatim, so this threshold cannot replace a short real report. Both values are recorded by run_manifest and operator overrides are rejected for formal runs."}]}
  langchain-odr:   {delivery: in_process,  fetch_observable: true,  fetch_mode: none, deviations: [{kind: budget, detail: "The native open_deep_research graph keeps its framework defaults max_concurrent_research_units=5, max_researcher_iterations=6, and max_react_tool_calls=10. All stage output caps are clamped only to the shared 8192-token ceiling. Tavily query count, result processing, supervisor decisions, compression, and report generation remain framework-native; the former adapter that kept only the first query/tool/research call was retired."}]}
  ldr:             {delivery: subprocess,  fetch_observable: false, fetch_mode: unknown, deviations: [{kind: mask_round_trip, detail: "localhost <-> onestopmarket.com etc, applied before the call and undone after; off by default (LDR_INTENT_MASK)"}, {kind: budget, detail: "LDR uses its installed framework defaults: search.iterations=3, search.questions_per_iteration=1, search.max_results=50, and search.snippets_only=true. The former adapter-specific 2/2/6/full-page override was removed. LDR_SEARCH_ITERATIONS, LDR_QUESTIONS_PER_ITERATION, and LDR_SEARCH_MAX_RESULTS remain env-addressable for debugging but every override is rejected for formal runs."}]}
  ii-researcher:   {delivery: subprocess,  fetch_observable: false, fetch_mode: direct_requests, deviations: []}
  # flowsearcher-ds fetches every page via POST {shim}/extract unconditionally;
  # once the /_mark bracket exists it is fully observable.
  flowsearcher-ds:
    delivery: subprocess
    fetch_observable: true
    fetch_mode: shim_extract
    deviations:
      - kind: budget
        detail: "Framework-native FlowSearcher-DS budgets: search max_results=10, up to 3 fetched pages per subgoal, 3000 characters per fetched page, 25000 total evidence characters, planner max_tokens=3000, and report max_tokens=8192. These remain content-neutral; the former scorer-shaped query/source/word/citation quotas were removed."
  gpt-researcher:  {delivery: in_process,  fetch_observable: false, fetch_mode: direct_requests, deviations: []}
  # opencode is taught the {shim}/fetch recipe, but its command allowlist also
  # permits curl to localhost:*, so the model can read the site off-shim. Treat
  # as unobservable until the allowlist is tightened (C3).
  opencode:        {delivery: cli,         fetch_observable: false, fetch_mode: shim_fetch, deviations: [{kind: capability_delivery, detail: "no search tool; shim curl recipe + write-to-file path in system prompt"}, {kind: budget, detail: "OPENCODE_CONTEXT_LIMIT=40960: context window opencode is told to assume for the inline model (scripts/runners/opencode_runner.py:143). Framework-required delivery; the opencode CLI manages its own context and must be given a window. 40960 is chosen to match the backbone's real usable window, so on par rather than an advantage. Declared because the assumed context window bounds how much a lane can hold and write, moving completeness."}]}
  claude-code:     {delivery: cli,         fetch_observable: false, fetch_mode: direct_curl, deviations: [{kind: capability_delivery, detail: "no search tool; shim curl recipe + write-to-file path in system prompt"}, {kind: routing, detail: "per-backbone CCR instance; identity asserted pre-run"}]}

  # Co-STORM is invoked in this Python process. Its SandboxSearchRM only POSTs
  # to shim /search and returns snippets/raw_content; there is no page-read tool.
  # The framework therefore has no unrecorded fetch channel, like the storm lane.
  co-storm:
    delivery: in_process
    fetch_observable: true
    fetch_mode: none
    deviations:
      - kind: budget
        detail: "Hardcoded Co-STORM budgets: retrieve_top_k=5, max_search_queries=2, total_conv_turn=10, max_search_queries_per_turn=3, warmstart_max_num_experts=3, warmstart_max_turn_per_experts=2, max_thread_num=3, and per-stage max_tokens=4096. These are framework-specific units and are not env-overridable."
      - kind: capability_delivery
        detail: "Co-STORM's embedding Encoder is replaced with the local paraphrase-MiniLM-L6-v2 SentenceTransformer because the shared backbone exposes no embedding endpoint."

  # Codex runs on the configured SSH host and invokes `codex exec` there. It is
  # eligible because the runner defines a custom OpenAI-compatible provider at
  # CODEX_DS_PROXY and passes the exact requested model; this differs from the
  # disabled gemini-cli runner, which can only use its provider-native models.
  codex:
    delivery: cli
    fetch_observable: false
    fetch_mode: direct_curl
    deviations:
      - kind: capability_delivery
        detail: "No native benchmark search tool; the CLI prompt supplies shim /search and /fetch curl recipes plus a per-run report-file path. codex exec has no per-host shell allowlist, so direct localhost curl remains possible."
      - kind: routing
        detail: "Runs by SSH on CODEX_SSH_HOST and defines model_provider=deepseek with CODEX_DS_PROXY; the exact requested model is passed with -m and must be identity-probed on that remote endpoint before a formal run."

  deepagents:
    delivery: subprocess
    fetch_observable: false
    fetch_mode: direct_requests
    deviations:
      - kind: capability_delivery
        detail: "DeepAgents has no built-in web tools; the adapter supplies internet_search (shim POST /search) and fetch_page (requests.get direct to the returned site URL)."
      - kind: budget
        detail: "Hardcoded adapter budgets: internet_search defaults to max_results=10 with include_raw_content=true; fetch_page returns at most 8000 characters; LangGraph recursion_limit=120; ChatOpenAI max_tokens=8192 and max_retries=3."
      - kind: mask_round_trip
        detail: "DEEPAGENTS_INTENT_MASK optionally applies localhost-to-neutral-domain masking before LLM calls and reverses only that round trip in the report; it is off by default."

  # Upstream local-deep-researcher is loaded only inside its dedicated venv.
  # The adapter pins Tavily search to the shim, but FETCH_FULL_PAGE is an
  # upstream behavior and the current checkout does not prove that every page
  # byte uses a recorded shim endpoint. Fail closed until a transport smoke does.
  local-deep-researcher:
    delivery: subprocess
    fetch_observable: false
    fetch_mode: unknown
    deviations:
      - kind: budget
        detail: "MAX_WEB_RESEARCH_LOOPS=3 is set by the harness and FETCH_FULL_PAGE=True is forced in both the subprocess environment and graph configuration. The three-loop cap bounds retrieval and completeness."
      - kind: mask_round_trip
        detail: "LCDR_INTENT_MASK optionally applies localhost-to-neutral-description masking and reverses only that round trip in the report; it is off by default."

  tongyi-dr:
    delivery: subprocess
    fetch_observable: false
    fetch_mode: direct_requests
    deviations:
      - kind: capability_delivery
        detail: "The adapter reimplements Tongyi's ReAct loop: search POSTs to shim /search, visit uses direct requests.get plus backbone summarization, and the upstream Scholar, Python, and file-parser tools are disabled."
      - kind: budget
        detail: "Hardcoded adapter budgets: MAX_LLM_CALLS=100 (the upstream default), MAX_CONTEXT_TOKENS=100000, search max_results=10, fetched HTML truncated to 80000 characters, visit summarizer max_tokens=4096, and final calls max_tokens=8192. The former lane-specific 1800-second self-abort was removed; the shared watchdog now owns termination."
