# Lane protocol: the declared, auditable contract for every benchmark lane.
#
# WHY THIS FILE EXISTS
#
# Until 2026-07-08 each lane's adapter quietly decided what its framework was
# told, how long it could run, and whether the harness would help it. The
# fairness audit found, among others:
#
#   - ldr's report had a "### Sources" block written by the harness. Deleting it
#     and rescoring dropped macro reach from 0.9519 to 0.0000 (qwen) and 0.9868
#     to 0.0000 (deepseek). The lane that ranked #1 on both boards had never
#     written a sandbox URL itself.
#   - smolagents was told "the report is invalid unless it contains at least 5
#     exact http://localhost URLs", and got a free retry whenever it missed that
#     bar. No other lane got a retry.
#   - gpt-researcher was handed a literal example citation which it copied
#     verbatim as its only sandbox URL.
#   - ldr rewrote any `en.wikipedia.org/wiki/X` the model emitted into a valid
#     Kiwix sandbox URL, converting off-sandbox drift into perfect grounding.
#   - Lane wall clocks ranged from 240s (qx-agents) to unlimited (camel-ai).
#
# None of this was written down anywhere. The rule now: a lane may only differ
# from the shared protocol in ways declared here, and `scripts/check_parity.py`
# fails the preflight when the code disagrees with this file.
#
# WHAT PARITY MEANS HERE
#
# Parity is on CAPABILITY, not on the literal prompt string. A native lane gets
# the sandbox as an in-process tool; a CLI lane has no search tool and must be
# told how to curl the shim. Those deliveries differ by necessity. What must be
# identical is the TASK: no lane may be told a citation count, a word count, a
# search count, or a citation format, because each of those is a scored axis.
#
# Budget policy (decided 2026-07-08): there is NO comparative wall clock. Cost
# is compared in tokens, which is what the cost-per-score axis reports. A single
# uniform no-progress watchdog kills a lane that has made no LLM call and no
# shim call for `stall_timeout_s`; that outcome is recorded as `stalled`
# (infrastructure), never as a framework failure, and is rerunnable.

version: lane-protocol-v1
date: 2026-07-08

shared:
  # Every lane receives exactly this and nothing more.
  intent_source: data/tasks/deep_research/cross_site_deep/<task_id>.json  # field: intent
  appended_to_intent: |
    Deliver your answer as a single self-contained markdown report. Return the
    report only, with no planning notes or tool transcripts.
  # Capability granted to every lane, in whatever form its runtime accepts.
  capabilities:
    search: shim POST /search        # one search affordance
    fetch: shim GET /fetch?url=...   # one page-read affordance, recorded
  # Anything not listed here is forbidden.
  forbidden_in_prompt:
    - citation counts        # "cite at least N URLs"
    - word or character counts
    - paragraph counts
    - search-call counts
    - search-breadth prescriptions  # "issue multiple queries"
    - fetch-all/every-result prescriptions
    - cross-source strategy prescriptions  # "cross-reference all three sites"
    - citation format prescriptions  # "use markdown links [label](url)"
    - example URLs
    - enumerations of the scorer's rubric
  forbidden_in_harness:
    - injecting URLs or source blocks into the saved report
    - rewriting URLs the model emitted (masking round-trips excepted)
    - retrying or repairing a report based on any scored quantity
    - gating capture on any scored quantity (reach, PoF, completeness)

budget:
  # This section is the SHARED budget policy (time and cost). PER-LANE budget
  # knobs (step cap, results-per-search, token/context window) are NOT uniform
  # and live in each lane's `deviations` as `kind: budget`; check_parity's
  # env_budget rule enforces that every such knob in code is declared there.
  wall_clock_s: null           # no comparative time limit
  stall_timeout_s: 900         # uniform no-progress watchdog (15 min)
  stall_status: stalled        # distinct from `timeout`; not a framework failure
  cost_axis: tokens            # llm_gateway usage log, attributed by run_id
  # Outer subprocess timeouts (OPENCODE_TIMEOUT, DEERFLOW_TASK_TIMEOUT_S,
  # FLOWSEARCHER_*_TIMEOUT, ...) are infrastructure caps governed by this uniform
  # policy, not scored budgets, so they are intentionally OUTSIDE the env_budget
  # rule's four suffixes (MAX_STEPS, SEARCH_MAX_RESULTS, TOKEN_LIMIT,
  # CONTEXT_LIMIT). The stall watchdog, not a per-lane clock, is the terminator.

backbone:
  # Cross-backbone comparison is only meaningful when nothing but the weights
  # changes. These must be identical across lanes AND across backbones.
  # NOT uniform, and saying so out loud beats a word that was never enforced.
  # llm_gateway injects {"thinking": {"type": "disabled"}} for deepseek-v4-*
  # only. GLM keeps thinking ON per the 2026-07-06
  # full-run decision. So a cross-backbone board compares a reasoning model
  # against a non-reasoning one, and swapping the backbone swaps more than the
  # weights. `preflight.check_backbone_sampling` asserts the code matches this
  # declaration; equalising it is a maintainer decision, not a code fix.
  thinking:
    uniform: false
    per_backbone:
      qwen3-8b: "on"
      glm-4.7-flash: "on"
      deepseek-v4: "off"
    note: >-
      Cross-backbone truth comparison is confounded while this is false.
      Single-backbone boards are unaffected.
  # DISCLOSURE (ruling #11): the budget unit is each backbone's own tokenizer token
  # (not characters, not words). The same 8192-token cap buys ~10-15%
  # different amounts of English text across the three tokenizers, so a report
  # written right up to the budget has a completeness ceiling that shifts
  # directionally by backbone. Read cross-backbone completeness with that in
  # mind; do NOT attribute the shift to model ability. Cost is likewise reported
  # in each backbone's own tokens (cost_axis: tokens).
  max_output_tokens: 8192
  # The word above said "identical" and nothing enforced it: the gateway capped
  # qwen at 8192, left deepseek uncapped, and RAISED glm to 131072, while
  # ds_proxy (the door eleven lanes use) enforced nothing. Both proxies now clamp
  # to this value via integrations/sampling_policy.apply_max_tokens, and a lane
  # that sends no max_tokens gets it explicitly instead of the upstream default.
  #
  # glm's exception is the thinking decision made visible: glm keeps thinking ON
  # (2026-07-06) and its thinking spends from the same max_tokens budget, so a
  # uniform 8192 would starve its visible answer. Cross-backbone comparison
  # against glm is confounded by this, exactly as the thinking note above says.
  max_output_tokens_exceptions:
    glm-4.7-flash: 131072
  temperature: 0.2
  # No lane set top_p except costorm (0.9), and no proxy forced it. 1.0 is the
  # no-truncation default: the sampler is then fully described by temperature.
  top_p: 1.0
  gateway: llm_gateway         # unified three-backbone endpoint on :8100

  # --- gateway_policy_disclosures (G0, added 2026-07-09) --------------------
  # The two LLM doors (llm_gateway :8100, used by claude-code; ds_proxy :8088,
  # used by eleven lanes) apply router-level policy BEYOND the shared sampler
  # above, and the two doors do not apply the same policy. SPEC_ISSUES §2 ruled:
  # unify OR declare in full -- this block is the full declaration, and
  # scripts/check_disclosure.py reconciles each mechanism's code signal against
  # it, so a new undeclared door behaviour (or a stale entry for a removed one)
  # fails the preflight. Whether any of these SHOULD be unified or removed is
  # the maintainer's (several tie into the §1 cross-backbone fork); this block
  # only guarantees none of them is silent.
  gateway_policy_disclosures:
    - kind: routing
      code: gw_fit_to_window
      human_zh: "仅 qwen 条目启用 fit_to_window:按 len//3 估算提示词令牌并夹紧 max_tokens 以塞进上下文窗,越窗时几何收缩重试;该估算对 ASCII 高估约 33%,可把预算削到共享上限之下。deepseek/glm 无此救援。"
      human_en: "fit_to_window is enabled for the qwen entry only: prompt tokens are estimated at len//3 and max_tokens is clamped to fit the context window, with a geometric shrink-and-retry on overflow. The estimator overestimates ASCII by ~33% and can cut the budget below the shared ceiling. deepseek/glm get no such rescue."
      detail: "integrations/llm_gateway/app.py: _approx prompt-size heuristic len(json.dumps(messages))//3, fit_to_window policy step, and the bounded geometric refit loop keyed on vLLM's overflow message. Enabled only for the qwen registry entry; a same-size overflow on deepseek/glm fails without rescue, and the ASCII overestimate can shrink a long-prompt qwen request's visible budget below max_output_tokens. Registered in SPEC_ISSUES §2 (estimator correction or mechanism declaration); declared here until the maintainer rules."
    - kind: routing
      code: gw_max_tokens_floor
      human_zh: "gateway 对 glm 条目设 max_tokens_floor=131072,将小额请求抬满;与上文 clamp-never-raise 相悖,floor 的去留属跨底模语义分叉(SPEC_ISSUES §1),在裁决前如实申报。"
      human_en: "The gateway sets max_tokens_floor=131072 for the glm entry, raising small requests to the full budget; this contradicts the clamp-never-raise wording above. The floor's fate belongs to the cross-backbone fork (SPEC_ISSUES §1) and is declared honestly until ruled."
      detail: "integrations/llm_gateway/app.py DEFAULT_REGISTRY glm-4.7-flash entry: max_tokens_floor=131072 (policy order floor -> cap -> fit -> thinking). The floor exists because glm keeps thinking ON (2026-07-06) and thinking spends from the same max_tokens budget. It raises requests, which the sampling_policy docstring says never happens; removing it or keeping it is the SPEC_ISSUES §1 cross-backbone equalisation fork. ds_proxy has no glm floor, so the same glm request leaves the two doors with different budgets unless the operator matches OPENAI_PROXY_MIN_MAX_TOKENS."
    - kind: routing
      code: dsp_transient_retries
      human_zh: "ds_proxy 对瞬态上游故障(超时/可重试报文)做有界退避重试;gateway 门超时直接上抛。两门传输可靠性不同。"
      human_en: "ds_proxy retries transient upstream failures (timeouts / retryable payloads) in a bounded backoff loop; the gateway door raises timeouts immediately. The two doors differ in transport reliability."
      detail: "integrations/ds_proxy/app.py _retry_pause/_retry_exhausted bounded loop (D13 bounded after an earlier unbounded version); integrations/llm_gateway/app.py has no equivalent for generic transient failures (its only retry is the qwen fit refit). A lane behind ds_proxy survives an upstream blip that fails a gateway lane."
    - kind: routing
      code: dsp_think_strip
      human_zh: "ds_proxy 从响应中剥除显式 <think> 包裹后转发;gateway 不做。"
      human_en: "ds_proxy strips explicit <think> wrappers from responses before forwarding; the gateway does not."
      detail: "integrations/ds_proxy/app.py _strip_think removes an explicit leading <think>...</think> block from response content (and _strip_json_fence unwraps code fences) before the client sees it. The gateway forwards content untouched, so a thinking-leaky upstream reads differently through the two doors."
    - kind: routing
      code: dsp_json_schema_downgrade
      human_zh: "ds_proxy 对 deepseek/glm 把 response_format=json_schema 降级为 json_object,并把 schema 作为系统提示注入;gateway 不做。"
      human_en: "ds_proxy downgrades response_format=json_schema to json_object for deepseek/glm and injects the schema as a system-prompt nudge; the gateway does not."
      detail: "integrations/ds_proxy/app.py: for models starting deepseek-v4/glm-, a json_schema response_format is rewritten to json_object and the schema text (truncated to 4000 chars) is prepended/merged into the system message. This is a request rewrite one door performs and the other does not; frameworks relying on structured output behave differently per door."
    - kind: budget
      code: dsp_min_max_tokens
      human_zh: "ds_proxy 的运维下限 OPENAI_PROXY_MIN_MAX_TOKENS 可把过小的 max_tokens 抬高,但以声明上限封顶(修复后),绝不越过协议 ceiling。"
      human_en: "ds_proxy's ops floor OPENAI_PROXY_MIN_MAX_TOKENS may raise a too-small max_tokens, but is capped at the declared ceiling (post-fix) and can never exceed the protocol's max_output_tokens."
      detail: "integrations/ds_proxy/app.py _apply_min_max_tokens: the env floor rescues reasoning models from a starved CoT budget. It formerly ran AFTER apply_max_tokens with no bound, letting an ops env exceed the declared ceiling (SPEC_ISSUES §2, fixed 2026-07-09: floor is now min(floor, per-model ceiling)). Default 0 = off; when set, it is an operator-visible knob recorded by the manifest env snapshot."

# fetch_observable / fetch_mode: whether a lane's PAGE READS pass through the
# recording shim, and by what mechanism. This is the transport-level provenance
# contract added 2026-07-08. The harness reads `fetch_observable` here and sends
# it on the shim /_mark bracket; `src/eval/fetch_log.py` withholds `pof` for any
# lane declared false, so a lane that reads pages off-shim is never scored 0 and
# never accused of citing pages it did not open. Filled honestly from the audit
# (internal/docs/FETCH_PATH_AUDIT_2026-07-08.md), NOT optimistically:
#
#   fetch_observable: true  -> every page read this lane can do goes through the
#                              shim (or the lane reads no pages at all), so the
#                              transport metrics are trustworthy for it.
#   fetch_observable: false -> the lane has a page-read channel that bypasses the
#                              shim; pof is withheld until that channel is
#                              converged AND a smoke run shows fetch rows > 0.
#
#   fetch_mode values:
#     shim_extract   -> POST {shim}/extract (recorded)
#     shim_fetch     -> GET {shim}/fetch?url= (recorded)
#     direct_requests-> requests.get to the site (bypasses shim)
#     direct_aiohttp -> aiohttp session.get to the site (bypasses shim)
#     direct_curl    -> shell `curl` to the site (bypasses shim)
#     none           -> no page-read step; consumes search snippets only
#     unknown        -> upstream not installed/read yet; must be verified on-box
#                       before any pof is recorded for it
lanes:
  # `deviations` must be empty for a lane to count as protocol-clean. A non-empty
  # list is a declared, justified exception that the board must disclose.
  #
  # kind: budget (added 2026-07-09, P4). A per-lane knob that bounds how much a
  # lane can retrieve, hold, or write: step cap, results-per-search, token or
  # context window. These are never in the prompt, so the prompt-parity RULES in
  # scripts/check_parity.py never saw them, yet they move reach and completeness
  # exactly as a prompt steer would. Any `os.environ.get("<LANE>_MAX_STEPS" |
  # "<LANE>_SEARCH_MAX_RESULTS" | "<LANE>_TOKEN_LIMIT" | "<LANE>_CONTEXT_LIMIT")`
  # in the adapter surface MUST be named in a {kind: budget} deviation for that
  # lane; check_parity's env_budget rule fails the preflight otherwise. The rule
  # forces the asymmetry to be written down; it does not equalise the VALUE,
  # because heterogeneous frameworks have no common step/token unit. The detail
  # states the exact env var, its value, and whether it is framework-required
  # (part of delivery) or harness-imposed (our own code).
  # deerflow's only page-read affordance is crawl_tool, which the adapter routes
  # through the recording shim's POST /extract (fetch_mode: shim_extract), the
  # same path flowsearcher-ds uses. fetch_observable stays false pending an
  # on-shim smoke proving recorded fetch rows > 0 for this lane end-to-end (the
  # audit's fail-closed ordering rule); flipping it is a scoring change deferred
  # to the next run. The old protocol wrongly said direct_requests/off-shim.
  deerflow:
    delivery: subprocess
    fetch_observable: false
    fetch_mode: shim_extract
    deviations:
      - kind: budget
        code: budget_page_chars
        human_zh: "适配层 crawl_tool 将每页经 shim /extract 取回并去标签后的可读文本截断至 2000 字符(harness 施加),低于框架原生整页。"
        human_en: "The adapter crawl_tool truncates each page's shim /extract tag-stripped readable text to 2000 characters (harness-imposed), below the framework's native full page."
        detail: "scripts/runners/deerflow_runner.py _sandbox_crawl tag-strips the shim /extract raw_content and truncates it to 2000 characters ([:2000]). Harness-imposed by our replacement crawl tool; it bounds how much of each fetched page the model sees, moving completeness. Declared because a per-page character cap is a per-lane budget the prompt-parity rules never see."
      - kind: budget
        code: budget_token
        human_zh: "DeerFlow 的上下文压缩令牌阈值;默认不设,走框架自带的按模型名推断,默认榜上无 harness 额外上限。"
        human_en: "DeerFlow context-compression token threshold; default unset, so the framework's own model-name inference applies and no harness cap is imposed on the default board."
        detail: "DEERFLOW_TOKEN_LIMIT: DeerFlow context-compression threshold (scripts/runners/deerflow_runner.py:422). Env-overridable; default unset = None = DeerFlow's own model-name inference, the framework default. On the default board no harness cap is imposed, so this lane is on par; an operator override is the only way a per-lane token budget appears, and it is disclosed by this entry. Declared because a token/context window bounds how much a lane can read and write, and therefore moves completeness."
      - kind: adapter_retry
        code: adapter_retries
        human_zh: "生成的 conf.yaml 设 BASIC_MODEL.max_retries=3:框架 LLM 客户端的适配层重试次数,原生不设。"
        human_en: "The generated conf.yaml sets BASIC_MODEL.max_retries=3: an adapter-layer retry count for the framework's LLM client that it would not otherwise carry."
        detail: "scripts/runners/deerflow_runner.py _build_conf_yaml writes BASIC_MODEL.max_retries=3 into the generated conf.yaml; DeerFlow's LLM client honours this retry count. It is adapter-imposed, not a framework default. Declared because an adapter-layer retry changes delivery reliability relative to a framework given none."
      - kind: fetch_withhold
        code: fetch_withhold
        human_zh: "页面读取经记录 shim 的 POST /extract(fetch_mode: shim_extract);在冒烟证明本车道端到端记录到 fetch 行之前,fetch_observable 暂保持 false、proof-of-fetch 予以保留,绝不记 0(翻转观测属打分变更,留待下次跑)。"
        human_en: "Page reads route through the recording shim's POST /extract (fetch_mode: shim_extract); fetch_observable is kept false and proof-of-fetch withheld until a smoke run proves recorded fetch rows > 0 for this lane end-to-end, and is never scored 0 (flipping observability is a scoring change deferred to the next run)."
        detail: "deerflow's crawl_tool routes page reads through the recording shim's POST /extract (fetch_mode: shim_extract), so the mechanism is on-shim (flowsearcher-ds uses the same /extract path and is already observable). fetch_observable is kept false and pof withheld (available=False + reason) until a smoke run proves recorded fetch rows > 0 for this lane end-to-end -- the audit's fail-closed ordering rule. Flipping observability is a scoring change deferred to the next run; pof is never scored 0 for lack of observation."
  # storm and langchain-odr read no pages: their only affordance is shim /search,
  # so a pof of 0 is honest, not an accusation. Their real cited URLs land in
  # `snippet_only` (search returned them). fetch_observable stays true because
  # there is no off-shim read to miss; withholding here would drop the honest
  # snippet_only classification.
  storm:
    delivery: in_process
    fetch_observable: true
    fetch_mode: none
    deviations:
      - kind: capability_delivery
        code: capability_lexical_rank
        human_zh: "STORM 检索后的 SentenceTransformer 索引被替换为确定性词法打分器(离线 worker 无嵌入模型下载通道);其余检索预算保持框架原生。"
        human_en: "STORM's post-retrieval SentenceTransformer index is replaced by a deterministic lexical scorer (the offline worker has no embedding-model download channel); other research budgets stay framework-native."
        detail: "STORM's post-retrieval SentenceTransformer index is replaced with a deterministic lexical scorer because the formal offline worker has no embedding-model download channel. Research budgets remain native: max_conv_turn=3, max_perspective=3, search_top_k=3, retrieve_top_k=3, and max_thread_num=10. The lexical ranking substitution can change which already-collected snippets reach article generation and must be disclosed on comparative boards until a pinned read-only native embedding cache is mounted."
      - kind: snippet_only
        code: snippet_only
        human_zh: "架构上无页面读取工具,仅消费搜索片段(fetch_mode: none);引用按 snippet_only 如实归类,与读页车道不同轨。"
        human_en: "No page-read tool by architecture; consumes search snippets only (fetch_mode: none). Citations classify honestly as snippet_only, a different track from page-reading lanes."
        detail: "STORM's only affordance is shim /search: it reads no pages, by architecture. pof=0 is honest here (there is no off-shim read to miss) and its real cited URLs land in the snippet_only provenance class. This is a structural difference from page-reading lanes that the board must disclose. How score_completeness's fetch threshold should treat declared fetch_mode:none lanes is a frozen semantic fork registered in docs/SPEC_ISSUES.md (section 1, first entry), pending the maintainer's ruling; this deviation only discloses the architecture."
  qx-agents:
    delivery: subprocess
    fetch_observable: false
    fetch_mode: direct_aiohttp
    deviations:
      - kind: capability_delivery
        code: capability_searxng_shim
        human_zh: "原生 qx DeepResearcher 经本地 shim 翻译层接入 SearchXNG,解析 shim 仅剥除 <think> 包裹,不伪造回退对象。"
        human_en: "Native qx DeepResearcher reaches SearchXNG through a local shim translator; the parser shim strips only <think> wrappers and fabricates no fallback objects."
        detail: "The native qx DeepResearcher pipeline uses its SearchXNG interface through a local shim translator and the requested local OpenAI-compatible backbone. A parser shim removes only explicit <think> wrappers before qx's normal schema validation; it does not fabricate fallback objects."
      - kind: budget
        code: budget_native
        human_zh: "框架原生预算:max_iterations=5、max_time_minutes=10、max_turns=10、SearchXNG pageLength=10。"
        human_en: "Framework-native budgets: max_iterations=5, max_time_minutes=10, openai-agents max_turns=10, SearchXNG pageLength=10."
        detail: "Framework-native budgets: max_iterations=5, max_time_minutes=10, openai-agents max_turns=10, and SearchXNG pageLength default 10. The former harness-specific 1 iteration / 4 minute / 12 turn mix was removed."
      - kind: fetch_withhold
        code: fetch_withhold
        human_zh: "页面读取经 aiohttp 直连、绕过记录 shim,proof-of-fetch 予以保留(available=False + 原因码),绝不记 0。"
        human_en: "Page reads go via aiohttp direct to the site, bypassing the recording shim, so proof-of-fetch is withheld (available=False + reason) and never scored 0."
        detail: "Page reads use an aiohttp session.get direct to the site, bypassing the recording shim, so proof-of-fetch cannot be observed for this lane. pof is withheld (available=False + reason) until an on-shim transport is proven; it is never scored 0."
  # camel-ai's only page-read channel is the shim /extract tool (used when the
  # model calls tavily_extract); it has no direct-fetch bypass, so metrics are
  # trustworthy even though a given run may not fetch at all.
  camel-ai:
    delivery: in_process
    fetch_observable: true
    fetch_mode: shim_extract
    deviations:
      - kind: report_postprocess
        code: report_postprocess
        human_zh: "保存前经 harness 剥除配平的 <think>/<tool_call>/<tool_response> 框架 XML 标记对;未闭合标签原样保留,正文与引用逐字不动。"
        human_en: "Before saving, the harness strips BALANCED <think>/<tool_call>/<tool_response> framework XML marker pairs; unclosed tags are left as-is and prose/citations are byte-for-byte untouched."
        detail: "scripts/run_deep_task.py _sanitize_camel_report removes only balanced <tag>...</tag> pairs (think/tool_call/tool_response) from the saved report. An unclosed opener is preserved verbatim; the former dangling-opener `.*` strip deleted the report body to EOF whenever a single reasoning tag was left open mid-report. This changes the saved artifact only, not camel's behavior/prompts/termination, and the audit's model-capability verdict on camel's grounding stands."
  # smolagents' VisitWebpageTool uses requests.get direct to the site. The
  # in-process gate can rewrite sandbox GETs to {shim}/fetch, but it is only
  # installed under --strict-sandbox today; on the default board the read is
  # off-shim. Keep false until the gate is installed on this path AND a smoke run
  # shows fetch rows > 0, per the audit's ordering rule.
  smolagents:
    delivery: in_process
    fetch_observable: false
    fetch_mode: direct_requests
    deviations:
      - kind: budget
        code: budget_steps
        human_zh: "SMOLAGENTS_MAX_STEPS=20:smolagents ToolCallingAgent 的原生代理循环步数上限(框架构造器默认)。"
        human_en: "SMOLAGENTS_MAX_STEPS=20: the smolagents ToolCallingAgent agentic-loop cap (the framework constructor's native default)."
        detail: "SMOLAGENTS_MAX_STEPS=20: smolagents ToolCallingAgent agentic-loop cap (scripts/run_deep_task.py). This is the framework constructor's native default, restored after the adapter-specific grant of 24 steps was removed. The env name remains declared because any operator override changes retrieval capacity and is rejected for formal runs."
      - kind: budget
        code: budget_search_results
        human_zh: "SMOLAGENTS_SEARCH_MAX_RESULTS=6:我们 ShimSearchTool 每次 /search 传入的结果条数(harness 施加),低于若干 CLI/原生车道请求的 10。"
        human_en: "SMOLAGENTS_SEARCH_MAX_RESULTS=6: results-per-search our ShimSearchTool wrapper passes to shim /search (harness-imposed), lower than the 10 several CLI and native lanes request."
        detail: "SMOLAGENTS_SEARCH_MAX_RESULTS=6: results-per-search our ShimSearchTool wrapper passes to shim /search (scripts/run_deep_task.py). Harness-imposed by our tool code. 6 is lower than the 10 several CLI and native lanes request; results-per-search is not uniform across heterogeneous frameworks."
